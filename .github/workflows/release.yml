name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release zip
        run: |
          zip -r parrotflowerpower.zip custom_components/parrotflowerpower

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: parrotflowerpower.zip
